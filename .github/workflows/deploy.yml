name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    environment: production
    # Skip until the VPS secrets exist (first push happens before the server is ready).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Strip CR: a key pasted through the browser on Windows gets CRLF endings, which ssh rejects.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null || { echo "::error::VPS_SSH_KEY is not a valid private key (gh secret set VPS_SSH_KEY < keyfile)"; exit 1; }
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Pull and restart on the server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          cd ~/launchscout
          git fetch --prune origin main
          git reset --hard origin/main
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
          docker image prune -f >/dev/null
          EOF

      - name: Health check
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$DOMAIN/api/health"; then echo; echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "health check failed" >&2
          exit 1
