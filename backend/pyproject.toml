[project]
name = "launchscout-backend"
version = "0.1.0"
description = "LaunchScout: CrewAI competitor research crew + FastAPI API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "crewai[tools,anthropic,litellm]==1.15.43",
  "crewai-tools==1.15.43",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow ₹ and typographic characters

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# crewai decorators (@agent, @task, event_bus.on) are untyped third-party code
disallow_untyped_decorators = false
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["crewai.*", "crewai_tools.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits real LLM + Serper APIs (opt-in: pytest -m live)"]
addopts = "-m 'not live'"
