[project]
name = "launchscout-backend"
version = "0.1.0"
description = "LaunchScout: CrewAI competitor research crew + FastAPI API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "crewai[tools,anthropic,litellm]==1.15.43",
  "crewai-tools==1.15.43",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "fastapi>=0.165",
  "uvicorn[standard]>=0.34",
  "sse-starlette>=3.0",
  "sqlalchemy[asyncio]>=2.0.40",
  "asyncpg>=0.30",
  "alembic>=1.15",
  "arq>=0.26",
  "redis>=5.2",
  "limits>=5.0",
  "httpx>=0.28",
  "markdown-it-py>=3.0",
  "weasyprint>=65",
  "python-json-logger>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "fakeredis>=2.26",
  "aiosqlite>=0.21",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow ₹ and typographic characters

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# crewai decorators (@agent, @task, event_bus.on) are untyped third-party code
disallow_untyped_decorators = false
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["crewai.*", "crewai_tools.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits real LLM + Serper APIs (opt-in: pytest -m live)"]
addopts = "-m 'not live'"

[tool.ruff.lint.per-file-ignores]
"app/services/pdf.py" = ["E501"]  # embedded CSS
